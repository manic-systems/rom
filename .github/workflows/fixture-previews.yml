name: Fixture Previews

# Records before/after GIFs of every changed fixture. This runs untrusted pull
# request code, so it only uploads an artifact. We have another workflow caleld
# `fixture-previews-post.yml` which actually posts the comment afterwards.
# _Kinda_ sketchy, but I want nice previews for this.

on:
  pull_request:
    paths:
      - rom/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - flake.nix
      - flake.lock
      - nix/**
      - scripts/**
      - .github/workflows/fixture-previews.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      # The fixture tests keep every variant's `.snap` current, so comparing
      # them decides what changed without running anything.
      - name: Compare
        id: compare
        run: |
          git worktree add --detach base-src HEAD^1
          nix develop .#previews -c nu scripts/fixture-previews.nu compare \
            --base base-src/rom/tests/fixtures --head rom/tests/fixtures --out preview
          echo "base=$(jq '.changed | length > 0' preview/manifest.json)" >> "$GITHUB_OUTPUT"
          echo "head=$(jq '.changed + .added | length > 0' preview/manifest.json)" >> "$GITHUB_OUTPUT"

      # Without its base GIFs, the comparison falls back to showing the head
      # alone.
      - name: Animate base
        id: base
        if: steps.compare.outputs.base == 'true'
        continue-on-error: true
        run: |
          {
            nix build -L ./base-src --out-link base-rom &&
            nix develop .#previews -c nu scripts/fixture-previews.nu animate \
              --rom base-rom/bin/rom --replay base-src/scripts/replay-fixture.nu \
              --fixtures base-src/rom/tests/fixtures \
              --manifest preview/manifest.json --side base --out preview
          } || {
            rm -rf preview
            nix develop .#previews -c nu scripts/fixture-previews.nu compare \
              --base missing --head rom/tests/fixtures --out preview
            exit 1
          }

      - name: Animate head
        if: steps.compare.outputs.head == 'true' || steps.base.outcome == 'failure'
        run: |
          nix build -L --out-link head-rom
          nix develop .#previews -c nu scripts/fixture-previews.nu animate \
            --rom head-rom/bin/rom --replay scripts/replay-fixture.nu \
            --fixtures rom/tests/fixtures \
            --manifest preview/manifest.json --side head --out preview

      - name: Name pull request
        env:
          PR: ${{ github.event.pull_request.number }}
        run: echo "$PR" > preview/pr.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-previews
          path: preview
          retention-days: 7
