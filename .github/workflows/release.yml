name: Tag and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  prepare-cognos:
    name: Prepare cognos
    permissions:
      contents: write
      id-token: write
    needs: ci
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@02fcd089a850e25bc6eff55f74db80c12b54391e # v2.3.4
    with:
      stage: prepare
      assets: false
      tag-prefix: cognos-v
      version-command: nix run nixpkgs#fq -- -r .package.version crates/cognos/Cargo.toml

  publish-cognos:
    name: Publish cognos
    permissions:
      contents: write
      id-token: write
    needs: prepare-cognos
    if: ${{ needs.prepare-cognos.result == 'success' && needs.prepare-cognos.outputs.skip != 'true' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@02fcd089a850e25bc6eff55f74db80c12b54391e # v2.3.4
    with:
      stage: publish
      version: ${{ needs.prepare-cognos.outputs.version }}
      install-nix: false
      publish-command: cargo publish --locked -p cognos

  prepare-rom:
    name: Prepare rom
    permissions:
      contents: write
      id-token: write
    needs: ci
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@02fcd089a850e25bc6eff55f74db80c12b54391e # v2.3.4
    with:
      stage: prepare
      assets: false

  publish-rom:
    name: Publish rom
    permissions:
      contents: write
      id-token: write
    # rom may need the cognos release from this same push
    needs: [prepare-rom, publish-cognos]
    if: >-
      ${{ !cancelled()
      && needs.prepare-rom.result == 'success'
      && needs.prepare-rom.outputs.skip != 'true'
      && needs.publish-cognos.result != 'failure' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@02fcd089a850e25bc6eff55f74db80c12b54391e # v2.3.4
    with:
      stage: publish
      version: ${{ needs.prepare-rom.outputs.version }}
      install-nix: false
      publish-command: cargo publish --locked -p rom
